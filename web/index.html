<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vehicle Management System (VMS) - Professional Corporate Fleet Management Platform">

  <!-- Mobile & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VMS Fleet">

  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <title>Vehicle Management System (VMS)</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #1E3A8A;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DBEAFE;
      border-top: 4px solid #1E3A8A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .loading-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">Vehicle Management System</div>
    <div class="loading-subtitle">Initializing workspace...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
