<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="vmsWindshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="vmsLights" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="vmsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Background App Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#vmsBg)"/>
  <!-- Subtle Inner Border Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#60A5FA" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Speed Arc Accent in Background -->
  <path d="M 64 360 A 200 200 0 0 1 448 360" fill="none" stroke="url(#vmsAccent)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 8"/>

  <!-- Tires -->
  <rect x="92" y="324" width="48" height="68" rx="14" fill="#090D16"/>
  <rect x="372" y="324" width="48" height="68" rx="14" fill="#090D16"/>

  <!-- Main Car Body / Cabin -->
  <path d="M 132 186 C 142 142, 172 118, 214 114 L 298 114 C 340 118, 370 142, 380 186 L 416 262 C 426 278, 432 296, 432 316 L 432 344 C 432 356, 422 366, 410 366 L 392 366 C 380 366, 370 356, 370 344 L 370 330 L 142 330 L 142 344 C 142 356, 132 366, 120 366 L 102 366 C 90 366, 80 356, 80 344 L 80 316 C 80 296, 86 278, 96 262 Z" 
        fill="#FFFFFF"/>

  <!-- Windshield with Sleek Pillared Silhouette -->
  <path d="M 154 196 C 160 162, 184 144, 222 140 L 290 140 C 328 144, 352 162, 358 196 L 382 254 L 130 254 Z" 
        fill="url(#vmsWindshield)"/>

  <!-- Center Hood Character Lines -->
  <path d="M 226 254 L 234 142" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M 286 254 L 278 142" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Aerodynamic Lower Bumper / Grille -->
  <rect x="194" y="294" width="124" height="24" rx="8" fill="#1E293B"/>
  <line x1="210" y1="302" x2="302" y2="302" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="310" x2="302" y2="310" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- High-Tech LED Headlights -->
  <path d="M 112 280 C 122 268, 148 268, 164 282 C 164 290, 146 300, 124 298 C 114 298, 110 290, 112 280 Z" 
        fill="url(#vmsLights)"/>
  <circle cx="138" cy="286" r="6" fill="#FFFFFF"/>

  <path d="M 400 280 C 390 268, 364 268, 348 282 C 348 290, 366 300, 388 298 C 398 298, 402 290, 400 280 Z" 
        fill="url(#vmsLights)"/>
  <circle cx="374" cy="286" r="6" fill="#FFFFFF"/>

  <!-- VMS Monogram Badge at Bottom -->
  <text x="256" y="442" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="12" 
        fill="#FFFFFF" 
        text-anchor="middle">VMS</text>
</svg>
